version: '3.8'

# VIVU 10,000 CCU Production Architecture
# PostgreSQL 16 (pgvector) + PgBouncer (10k pool) + Redis Cluster Cache + Express API

services:
  # 1. Cơ sở dữ liệu quan hệ & Vector PostgreSQL (pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vivu_postgres
    restart: always
    environment:
      POSTGRES_USER: vivu_admin
      POSTGRES_PASSWORD: vivu_secure_password_2026
      POSTGRES_DB: vivu_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivu_admin -d vivu_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PgBouncer Connection Pooler (Chịu tải 10,000 CCU -> 150-200 physical connections)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vivu_pgbouncer
    restart: always
    environment:
      DB_USER: vivu_admin
      DB_PASSWORD: vivu_secure_password_2026
      DB_HOST: postgres
      DB_NAME: vivu_production
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 150
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 600
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Redis In-Memory Cache & Geospatial Index
  redis:
    image: redis:7-alpine
    container_name: vivu_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. VIVU Backend API Server Cluster
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vivu_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://vivu_admin:vivu_secure_password_2026@pgbouncer:6432/vivu_production?sslmode=disable"
      DIRECT_URL: "postgresql://vivu_admin:vivu_secure_password_2026@postgres:5432/vivu_production?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "vivu_super_secret_jwt_key_2026_production"
      JWT_EXPIRES_IN: "7d"
    ports:
      - "5000:5000"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
